# Alias de ingredientes activos. Cada entrada sale de un nombre real de SIGIA que no coincidió con el catálogo de
# residuos de la UE (instantáneas del 27 y 28/10/2026), y el destino se comprobó en ese catálogo. La carga del grafo
# falla si un destino deja de existir o si un ingrediente queda sin destino ni motivo, de modo que una descarga
# nueva con nombres distintos se detecta en vez de pasar en silencio.

