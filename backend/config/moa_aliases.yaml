# Alias hacia las clasificaciones de modo de acción (instantánea del 28/10/2026: FRAC 2026, IRAC 11.5, HRAC 2026).
# Clave: el ingrediente ya normalizado (nombre ISO del grafo). Valor: el nombre o los nombres tal como figuran en la
# lista del comité, comprobados en ella. La carga falla si un destino desaparece o si un ingrediente químico queda
# sin grupo ni motivo.

