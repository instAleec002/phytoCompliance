[project]
name = "tp202620505-backend"
version = "0.1.0"
description = "Backend del sistema de cumplimiento fitosanitario (reglas, conocimiento, asistente e interfaces)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "argon2-cffi>=23.1",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "opendataloader-pdf>=1.0",
    "pysbd>=0.3.4",
    "google-genai>=1.0",
    "langgraph>=1.2.24",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
docling = [
    "docling>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]
# encoder (BGE-M3) and local models; they were installed by hand and a plain «uv sync» removed them (11/11/2026)
ml = ["torch>=2.5", "transformers>=4.45", "accelerate>=1.0", "safetensors>=0.4"]

[tool.uv]
default-groups = ["dev", "ml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared", "src/domain", "src/knowledge", "src/assistant", "src/accounts", "src/evaluation", "src/interfaces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
