<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tab icon in the glossy style of the interface: an aqua tile (the blues of the primary button in theme.css)
       holding a green leaf (the green icon hue). A favicon is a standalone file, so the values are repeated here;
       keep them in step with theme.css when the palette changes. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e9fd"/>
      <stop offset="0.45" stop-color="#7fb2f3"/>
      <stop offset="0.55" stop-color="#4f8fe6"/>
      <stop offset="1" stop-color="#a9cdfa"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9f0d6"/>
      <stop offset="1" stop-color="#2f9a5e"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="url(#tile)" stroke="#24467f" stroke-width="1.5"/>
  <path d="M8 23C8 13 14 8 25 7c0 11-5 17-15 17z" fill="url(#leaf)" stroke="#1f6e42" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M9.5 22.5 20 12" stroke="#1f6e42" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M4 8.5C4 5.5 6 3.5 9 3.5h14c3 0 5 2 5 5v2c-6-2-18-2-24 0z" fill="#ffffff" opacity="0.45"/>
</svg>
